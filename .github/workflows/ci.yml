name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML
        run: npx --yes html-validate@11 boutique.html index.html privacy.html terms.html

  internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links resolve
        run: python3 scripts/check_internal_links.py boutique.html index.html privacy.html terms.html
